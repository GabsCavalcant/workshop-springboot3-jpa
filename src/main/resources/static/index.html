<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Admin - GabrielCant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-indigo-700 p-4 text-white shadow-xl mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold italic">GabrielCant Store</h1>
            <span class="text-sm opacity-80">Spring Boot 3 + JPA Hibernate</span>
        </div>
    </nav>

    <div class="container mx-auto px-4 space-y-12">
        
        <section id="section-users" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4 text-indigo-900">Novo Cliente</h2>
                <form id="userForm" class="space-y-3">
                    <input type="text" id="userName" placeholder="Nome" class="w-full p-2 border rounded" required>
                    <input type="email" id="userEmail" placeholder="E-mail" class="w-full p-2 border rounded" required>
                    <input type="text" id="userPhone" placeholder="Telefone" class="w-full p-2 border rounded" required>
                    <input type="password" id="userPassword" placeholder="Senha" class="w-full p-2 border rounded" required>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded font-bold hover:bg-indigo-700">Cadastrar</button>
                </form>
            </div>
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4">Clientes Cadastrados</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead><tr class="border-b text-gray-500 uppercase text-xs"><th>ID</th><th>Nome</th><th>Email</th><th>Ações</th></tr></thead>
                        <tbody id="userTableBody" class="divide-y text-sm"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4 text-green-700">Catálogo de Produtos</h2>
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-t-4 border-t-orange-500">
                <h2 class="text-xl font-bold mb-4 text-orange-700">🛒 Realizar Pedido</h2>
                <div class="space-y-4 text-sm">
                    <div>
                        <label class="block font-medium mb-1">Selecionar Cliente (ID):</label>
                        <select id="selectClient" class="w-full p-2 border rounded bg-gray-50"></select>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <h3 class="font-bold mb-2">Itens no Carrinho</h3>
                        <div id="cartItems" class="space-y-2 mb-4"></div>
                        <div class="text-right font-black text-lg border-t pt-2">Total: R$ <span id="cartTotal">0.00</span></div>
                    </div>
                    <button onclick="submitOrder()" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-orange-700 transition">
                        FINALIZAR PEDIDO
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script>
        // Configurações Globais
        const API = {
            users: '/users',
            products: '/products',
            orders: '/orders'
        };

        let cart = [];

        // --- LÓGICA DE USUÁRIOS ---
        async function loadUsers() {
            const res = await fetch(API.users);
            const users = await res.json();
            const table = document.getElementById('userTableBody');
            const select = document.getElementById('selectClient');
            
            table.innerHTML = users.map(u => `
                <tr class="hover:bg-gray-50"><td class="py-3">${u.id}</td><td class="font-medium">${u.name}</td><td>${u.email}</td>
                <td><button onclick="deleteUser(${u.id})" class="text-red-500">Excluir</button></td></tr>
            `).join('');

            select.innerHTML = users.map(u => `<option value="${u.id}">${u.name} (ID: ${u.id})</option>`).join('');
        }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                phone: document.getElementById('userPhone').value,
                password: document.getElementById('userPassword').value
            };
            await fetch(API.users, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(user)
            });
            loadUsers();
            e.target.reset();
        };

        async function deleteUser(id) {
            if(confirm('Deseja excluir este cliente?')) {
                const res = await fetch(`${API.users}/${id}`, { method: 'DELETE' });
                if(!res.ok) alert("Erro: Cliente possui pedidos vinculados!");
                loadUsers();
            }
        }

        // --- LÓGICA DE PRODUTOS ---
        async function loadProducts() {
            const res = await fetch(API.products);
            const products = await res.json();
            const grid = document.getElementById('productGrid');
            
            grid.innerHTML = products.map(p => `
                <div class="border p-3 rounded-lg hover:border-indigo-300 bg-white">
                    <p class="font-bold">${p.name}</p>
                    <p class="text-green-600 text-sm font-black">R$ ${p.price.toFixed(2)}</p>
                    <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})" 
                            class="mt-2 w-full text-xs bg-gray-100 py-1 rounded hover:bg-indigo-100 font-bold uppercase">
                        + Adicionar
                    </button>
                </div>
            `).join('');
        }

        // --- LÓGICA DO PEDIDO (ORDER) ---
        function addToCart(id, name, price) {
            const existing = cart.find(item => item.productId === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ productId: id, name, price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalSpan = document.getElementById('cartTotal');
            let total = 0;

            container.innerHTML = cart.map(item => {
                const sub = item.price * item.quantity;
                total += sub;
                return `
                    <div class="flex justify-between text-xs border-b pb-1">
                        <span>${item.quantity}x ${item.name}</span>
                        <span class="font-bold">R$ ${sub.toFixed(2)}</span>
                    </div>
                `;
            }).join('');
            totalSpan.innerText = total.toFixed(2);
        }

        async function submitOrder() {
            if(cart.length === 0) return alert("Carrinho vazio!");

            const orderPayload = {
                moment: new Date().toISOString(),
                orderStatus: 1, // PAID (Baseado no seu enum OrderStatus)
                client: { id: document.getElementById('selectClient').value },
                items: cart.map(item => ({
                    quantity: item.quantity,
                    price: item.price,
                    product: { id: item.productId }
                }))
            };

            const res = await fetch(API.orders, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(orderPayload)
            });

            if(res.ok) {
                alert("Pedido realizado com sucesso!");
                cart = [];
                updateCartUI();
            } else {
                alert("Erro ao processar pedido.");
            }
        }

        // Init
        loadUsers();
        loadProducts();
    </script>
</body>
</html>
